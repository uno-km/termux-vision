installation_body: |
  <div class="alert alert-tip">
    <span class="alert-title">Termux ARM64 Prerequisites</span>
    <p>Run the following command in Termux to install native build tools and Vulkan drivers:</p>
  </div>
  <pre><code>pkg update -y && pkg install -y python nodejs clang make cmake git termux-api wget vulkan-loader vulkan-headers vulkan-tools opencl-headers python-numpy libjpeg-turbo</code></pre>

  <h3>1. Python Package Installation (PyPI)</h3>
  <pre><code>pip install --upgrade pip setuptools wheel
  pip install termux-vision</code></pre>

  <h3>2. Direct GitHub Releases Wheel Asset</h3>
  <pre><code># Install official prebuilt v1.3.0 release wheel
  pip install https://github.com/uno-km/termux-vision/releases/download/v1.3.0/termux_vision-1.3.0-py3-none-any.whl</code></pre>

  <h3>3. Node.js CLI Installation (npm)</h3>
  <pre><code>npm install -g termux-vision</code></pre>

  <h3>4. Hardware GPU Acceleration Runtime</h3>
  <pre><code>pip install termux-vision ameva-runtime termux-llamacpp
  termux-vision doctor</code></pre>

  <h3>5. One-Line Bootstrap Installer</h3>
  <pre><code>curl -sL https://raw.githubusercontent.com/uno-km/termux-vision/main/install.sh | bash</code></pre>

advanced_parameters_body: |
  <h3>Unified CLI & Engine Parameter Matrix</h3>
  <p>termux-vision adheres 100% to the uno-km ecosystem CLI standard:</p>
  <table class="data-table">
    <thead>
      <tr>
        <th>Flag</th>
        <th>Aliases</th>
        <th>Default</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr><td><code>-d, --device</code></td><td><code>-b, --backend</code></td><td><code>auto</code></td><td>Compute acceleration backend: <code>auto</code>, <code>gpu</code>, <code>vulkan</code>, <code>cpu</code>, <code>vulkan-force</code></td></tr>
      <tr><td><code>-i, --image</code></td><td><code>--image-path</code></td><td><em>Required</em></td><td>Path to input image file (PNG, JPG, WebP)</td></tr>
      <tr><td><code>-p, --prompt</code></td><td>None</td><td><code>"Describe this image"</code></td><td>Multimodal query or instruction prompt</td></tr>
      <tr><td><code>-m, --model</code></td><td>None</td><td><code>smolvlm-500m</code></td><td>Language model GGUF path or catalog preset ID</td></tr>
      <tr><td><code>--mmproj</code></td><td>None</td><td><em>Auto-paired</em></td><td>Vision projector GGUF model path (mmproj-*.gguf)</td></tr>
      <tr><td><code>-n, --max-tokens</code></td><td><code>--n-predict</code></td><td><code>150</code></td><td>Maximum number of output tokens</td></tr>
      <tr><td><code>-c, --ctx-size</code></td><td><code>--ctx</code></td><td><code>2048</code></td><td>Context window size</td></tr>
      <tr><td><code>-t, --threads</code></td><td>None</td><td><code>auto</code></td><td>Number of CPU execution threads</td></tr>
      <tr><td><code>-W, --width</code></td><td>None</td><td>None</td><td>Resize image width in pixels</td></tr>
      <tr><td><code>-H, --height</code></td><td>None</td><td>None</td><td>Resize image height in pixels</td></tr>
      <tr><td><code>--image-size</code></td><td>None</td><td>None</td><td>Explicit resolution scaling (e.g. <code>224x224</code>, <code>384x384</code>)</td></tr>
      <tr><td><code>-q, --quality</code></td><td>None</td><td><code>optimal</code></td><td>4-tier preset: <code>fast</code> (384px), <code>optimal</code> (768px), <code>high</code> (1280px), <code>original</code> (1:1)</td></tr>
      <tr><td><code>--tune-mali</code></td><td>None</td><td><code>False</code></td><td>Enable ARM Mali GPU MMVQ optimization (<code>GGML_VK_FORCE_MMVQ=1</code>)</td></tr>
      <tr><td><code>--json</code></td><td>None</td><td><code>False</code></td><td>Output structured machine-readable JSON metrics</td></tr>
      <tr><td><code>-v, --verbose</code></td><td>None</td><td><code>False</code></td><td>Print detailed GPU layer offload logs</td></tr>
    </tbody>
  </table>

api_body: |
  <h3>Python SDK Core API Reference</h3>
  <table class="data-table">
    <thead>
      <tr>
        <th>Module / Function</th>
        <th>Signature</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><code>termux_vision.vlm.load</code></td>
        <td><code>load(model_id, device='auto', ngl=None)</code></td>
        <td>Context manager initializing the multimodal VLM engine with hardware offload.</td>
      </tr>
      <tr>
        <td><code>VLMEngine.describe</code></td>
        <td><code>describe(image_path, prompt, quality='optimal', max_tokens=150)</code></td>
        <td>Executes multimodal visual inference and returns text response with performance metrics.</td>
      </tr>
      <tr>
        <td><code>termux_vision.cv.canny</code></td>
        <td><code>canny(image_gray, low_threshold=40, high_threshold=120)</code></td>
        <td>Ultra-fast 5-stage Canny edge detector with 8-directional BFS hysteresis.</td>
      </tr>
      <tr>
        <td><code>termux_vision.detect.detect_faces</code></td>
        <td><code>detect_faces(image, min_size=(30, 30))</code></td>
        <td>Zero-dependency Haar-like cascade face candidate localization.</td>
      </tr>
      <tr>
        <td><code>termux_vision.cli.doctor.run_doctor</code></td>
        <td><code>run_doctor(probe_vulkan=True)</code></td>
        <td>Probes Vulkan ICD driver, RAM headroom, and big.LITTLE CPU topology.</td>
      </tr>
    </tbody>
  </table>

code_example_py: |
  import termux_vision as tv

  # 1. Zero-Dependency Spatial Filtering (0.01s ultra-fast)
  img = tv.io.load_image("photo.jpg")
  edges = tv.cv.canny(tv.transforms.to_grayscale(img), 40, 120)
  tv.io.save_image(edges, "edges.png")

  # 2. On-Device VLM Multimodal Inference with Vulkan GPU Acceleration
  with tv.vlm.load("smolvlm-500m", device="gpu") as engine:
      res = engine.describe("photo.jpg", prompt="Describe this scene in detail.", quality="optimal")
      print(f"Generated ({res.metrics.tokens_per_second:.1f} t/s): {res.text}")

code_example_js: |
  import tv from 'termux-vision';

  // 1. Diagnostics & Hardware Probe
  const doc = tv.doctor(true);
  console.log(`Vulkan GPU: ${doc.vulkan.status} | RAM: ${doc.hardware.availableRamMb} MB`);

  // 2. Multimodal VLM Inference with Quality Preset
  const engine = await tv.load({ modelId: 'smolvlm-500m', device: 'gpu' });
  const result = await engine.describe('photo.jpg', { quality: 'optimal', maxTokens: 150 });
  console.log(`[${result.metrics.backend.toUpperCase()}] ${result.text}`);
  engine.close();

