  - category: "Multimodal VLM"
    operations: "SmolVLM-500M, Qwen2-VL-2B, Supervised llama-cli Bridge, Dynamic Resolution Scaling"
    status: "Production"
  - category: "ARM Mali GPU Acceleration"
    operations: "Vulkan SPIR-V Compute (-ngl 99), 0.00 MiB CPU VRAM, MMVQ Kernel Tuning (--tune-mali)"
    status: "Production Verified"
  - category: "Qualcomm Adreno Acceleration"
    operations: "Snapdragon Adreno 7xx/8xx Freedreno/Turnip Bionic Vulkan Shader Pipeline"
    status: "In Development (개발 진행 중)"
  - category: "Samsung Xclipse Acceleration"
