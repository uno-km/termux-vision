# doc.config.yaml - Termux-Vision Single Source of Truth
name: "Termux-Vision"
lib_slug: "vision"
package_name_pypi: "termux-vision"
package_name_npm: "termux-vision"
version: "v1.4.0"
release_name: "Qualcomm Adreno 830 & ARM Mali Full-GPU VLM Acceleration"
license: "Apache-2.0"
platform: "Android ARM64 / Linux / Termux"
github_repo_url: "https://github.com/uno-km/termux-vision"

tagline_en: "Zero-Dependency On-Device Computer Vision & Multimodal VLM Inference Engine Utilizing Device Resources for Android Termux"
tagline_ko: "디바이스 리소스를 활용한 안드로이드 Termux 제로 디펜던시 온디바이스 컴퓨터 비전 & VLM 멀티모달 추론 엔진"

quick_install_cmd: "pip install termux-vision\n# or: pip install https://github.com/uno-km/termux-vision/releases/download/v1.4.0/termux_vision-1.4.0-py3-none-any.whl\n# or: npm install -g termux-vision\n# or: bash <(curl -sSL https://raw.githubusercontent.com/uno-km/termux-vision/main/install.sh)"

why_challenge_en: "Standard vision frameworks (OpenCV, TorchVision) suffer from massive binary sizes (>150MB), complex C++ compilation bottlenecks on ARM64 Termux, and lack seamless mobile VLM multimodal pipelines."
why_challenge_ko: "기존 OpenCV, TorchVision 등은 150MB 이상의 무거운 바이너리 크기와 모바일 ARM64 컴파일 실패율, 그리고 모바일 최적화 VLM 멀티모달 파이프라인의 부재로 인해 Termux 환경에서 활용이 극도로 제한적이었습니다."

description_en: "Provides pure Python/JS 5-stage Canny Edge, Sobel 3x3, Gaussian Blur, 2D Integral Images, Haar Cascade Face Detection, and on-device SmolVLM/Qwen2-VL Multimodal Vision-Language inference with pure Vulkan GPU offloading (0.00 MiB CPU VRAM)."
description_ko: "순수 Python/JS 5단계 Canny 엣지 검출, Sobel 3x3, 가우시안 블러, 2D 적분 영상 고속 필터링, Haar Cascade 얼굴 검출 및 순수 Vulkan GPU 오프로드(CPU 매핑 VRAM 0.00 MiB)를 통한 SmolVLM/Qwen2-VL 온디바이스 VLM 멀티모달 추론을 지원합니다."

features:
  - title_en: "Universal Parameter Suite & Sibling Alignment"
    title_ko: "공식 패밀리 표준 파라미터 규격 전면 정렬"
    desc_en: "Standardizes compute backend (-d/--device, -b/--backend), quantization (-m, --mmproj), and resolution scaling (-W, -H, --image-size) across CLI, Python, and Node.js."
    desc_ko: "형제 패밀리 표준에 맞춰 연산 가속 디바이스(-d/--device, -b/--backend), 모델 양자화 경로(-m, --mmproj), 해상도 스케일링(-W, -H, --image-size) 파라미터를 100% 통일했습니다."
  - title_en: "Pure Vulkan GPU Full-Layer Offloading"
    title_ko: "순수 Vulkan GPU 99개 레이어 풀 오프로드"
    desc_en: "Achieves 0.00 MiB CPU Mapped VRAM on Qualcomm Adreno (830) and ARM Mali (G78/G68), accelerating token generation up to 15.00 tok/s."
    desc_ko: "Qualcomm Adreno 830 및 ARM Mali(G78/G68)에서 CPU 매핑 VRAM 0.00 MiB를 달성하여 모델 텐서와 KV 캐시를 Vulkan 전용 버퍼로 완전 격리 오프로드합니다."
  - title_en: "Zero-Heavy C++ Dependency"
    title_ko: "외부 무거운 C++ 빌드 의존성 완전 배제"
    desc_en: "Runs out-of-the-box on vanilla Termux Python (pip) and Node.js (npm) without complex OpenCV or node-gyp builds."
    desc_ko: "복잡한 OpenCV나 node-gyp 빌드 과정 없이 순정 Termux Python 및 Node.js 환경에서 즉시 설치 및 구동됩니다."
  - title_en: "Silicon Architecture Roadmap"
    title_ko: "모바일 GPU 아키텍처 확장 로드맵"
    desc_en: "Qualcomm Adreno 830 and ARM Mali GPU production verified; Samsung Xclipse backend under active engineering."
    desc_ko: "Qualcomm Adreno 830 및 ARM Mali GPU는 정식 검증 완료되었으며, Samsung Xclipse 가속 백엔드는 현재 개발 진행 중입니다."

matrix_table:
  - category: "Classical CV Filters"
    operations: "5-Stage Canny Edge Detector, Sobel 3x3, Gaussian Blur 5x5, 2D Integral Images, Morphology"
    status: "Production"
  - category: "Multimodal VLM"
    operations: "Moondream2 1.8B, SmolVLM-500M, Qwen2-VL-2B, Supervised llama-cli Bridge, Dynamic Resolution Scaling"
    status: "Production"
  - category: "ARM Mali GPU Acceleration"
    operations: "Vulkan SPIR-V Compute (-ngl 99), 0.00 MiB CPU VRAM, MMVQ Kernel Tuning (--tune-mali)"
    status: "Production Verified"
  - category: "Qualcomm Adreno Acceleration"
    operations: "Snapdragon 8 Elite Adreno 830 Vulkan SPIR-V JIT Patch (mul_mat_vec_max_cols = 2), KGSL Watchdog Safe Prefill (-b 64 -ub 64)"
    status: "Production Verified (정식 지원 및 실기기 검증 완료)"
  - category: "Samsung Xclipse Acceleration"
    operations: "Exynos 2200/2400 AMD RDNA Mobile SPIR-V Instruction Scheduling"
    status: "In Development (개발 진행 중)"

